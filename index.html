<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegrey Hut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="loading-screen">
    <div class="loading-logo">
      <div class="logo-icon"></div>
      Elegrey Hut
    </div>
    <div class="progress-bar">
      <div class="progress"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-modal" id="auth-modal">
    <div class="auth-container">
      <div class="auth-header">
        <h2 class="auth-title" id="auth-title">Welcome Back</h2>
        <p class="auth-subtitle" id="auth-subtitle">Sign in to continue to Elegrey Hut</p>
      </div>
      
      <div class="auth-error" id="auth-error"></div>
      
      <form class="auth-form" id="auth-form">
        <div class="avatar-upload" id="avatar-upload" style="display: none;">
          <div class="avatar-preview" id="avatar-preview"></div>
          <input type="file" id="avatar-input" accept="image/*" style="display: none;">
        </div>
        
        <div class="auth-input-group" id="name-group" style="display: none;">
          <label class="auth-label" for="name-input">Username</label>
          <input type="text" class="auth-input" id="name-input" placeholder="Choose a username">
        </div>
        
        <div class="auth-input-group">
          <label class="auth-label" for="email-input">Email</label>
          <input type="email" class="auth-input" id="email-input" placeholder="your@email.com">
        </div>
        
        <div class="auth-input-group">
          <label class="auth-label" for="password-input">Password</label>
          <input type="password" class="auth-input" id="password-input" placeholder="••••••••">
        </div>
        
        <button type="submit" class="auth-button" id="auth-button">Sign In</button>
      </form>
      
      <div class="auth-footer">
        <span id="auth-toggle-text">Don't have an account?</span>
        <span class="auth-toggle" id="auth-toggle">Sign up</span>
      </div>
    </div>
  </div>

  <div id="app" style="display: none;">
    <!-- Main Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon"></div>
          Elegrey Hut
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle">≡</button>
      </div>

      <div class="channels" id="channels-list">
        <div class="channel-group">
          <div class="channel-group-header">
            <span>Text Channels</span>
            <button id="add-channel">+</button>
          </div>
        </div>
      </div>

      <div class="user-panel">
        <div class="user-avatar" id="user-avatar"></div>
        <div class="user-info">
          <div class="user-name" id="user-name">Loading...</div>
          <div class="user-status-text" id="user-status">Online</div>
        </div>
        <div class="user-controls">
          <button id="user-settings">⚙️</button>
          <button id="toggle-members">👥</button>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area">
      <div class="channel-header">
        <div class="channel-icon">#</div>
        <div class="channel-title" id="channel-title">general</div>
        <div class="channel-description" id="channel-description">General discussions</div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="typing-indicator" id="typing-indicator" style="display: none;">
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
        <span id="typing-text">Someone is typing...</span>
      </div>

      <div class="message-input-container">
        <textarea class="message-input" id="message-input" placeholder="Message #general" rows="1"></textarea>
        <div class="input-controls">
          <button>😊</button>
          <button>📎</button>
          <button class="send-button" id="send-button">↑</button>
        </div>
      </div>
    </div>

    <!-- Members Sidebar -->
    <div class="members-sidebar" id="members-sidebar">
      <div class="members-header">Online — <span id="online-count">0</span></div>
      <div id="members-list"></div>
    </div>
  </div>

  <div class="notification" id="notification">
    <span id="notification-message">New message received</span>
  </div>

  <!-- Firebase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
